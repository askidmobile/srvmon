name: CI

# Runs on PRs, and as the first job of Release for every push to main or a
# v* tag (workflow_call), so images are only published from green commits.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a Release
  # run never cancels or is cancelled by a PR run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: build binaries
        run: |
          CGO_ENABLED=0 go build -o /tmp/srvmon-server ./cmd/server
          CGO_ENABLED=0 go build -o /tmp/srvmon-agent ./cmd/agent

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/*.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [go, web, ai]
    strategy:
      matrix:
        image: [server, agent, ai]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
