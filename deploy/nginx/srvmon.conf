# srvmon behind an nginx that already runs on the host (SRVMON_PROXY=external).
# Replace srvmon.example.com with SRVMON_DOMAIN, put the file where that nginx
# includes sites from (http block), then `nginx -t && nginx -s reload`.
# nginx must reach SRVMON_HTTP_BIND (default 127.0.0.1:8088): run it on the
# host or in a container with network_mode: host.
#
# Layout matches a host where TCP/443 is held by an nginx `stream` SNI/ALPN
# router that passes HTTPS to 127.0.0.1:8443 (yttri-meet). For a plain nginx
# change `listen 127.0.0.1:8443 ssl;` to `listen 443 ssl;`.

map $http_upgrade $srvmon_connection_upgrade {
    default upgrade;
    ''      close;
}

# Real client IP. Behind a stream router every peer is 127.0.0.1, so the
# router must send PROXY protocol (`proxy_protocol on;` in its stream server)
# and the 127.0.0.1:8443 socket must accept it (`proxy_protocol` on one of its
# listen lines, usually the router owner's site). Without it this falls back
# to $remote_addr and srvmon sees every client as 127.0.0.1: one shared login
# rate limit and no useful fail2ban bans. See deploy/nginx/README.md.
map $proxy_protocol_addr $srvmon_client_ip {
    ''      $remote_addr;
    default $proxy_protocol_addr;
}

server {
    listen 80;
    server_name srvmon.example.com;

    # HTTP-01 challenge for certbot --webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name srvmon.example.com;

    ssl_certificate     /etc/letsencrypt/live/srvmon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srvmon.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Agents send gzip batches up to 4 MiB.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # srvmon takes the rightmost X-Forwarded-For entry as the client IP
        # (rate limit, fail2ban); set it to the real peer, do not append.
        proxy_set_header X-Forwarded-For $srvmon_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        # Web terminal (WebSocket).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $srvmon_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
