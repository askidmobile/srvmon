# Central monitoring server. Deployed by .github/workflows/deploy.yml into
# DEPLOY_PATH (default /opt/srvmon) together with Caddyfile and .env.
#
# Two ways to expose the panel (SRVMON_PROXY in GitHub vars or .env):
#   caddy    - bundled Caddy takes 80/443 and gets the certificate (default);
#   external - the host already has a reverse proxy (nginx, Traefik, ...):
#              Caddy is not started, proxy https://SRVMON_DOMAIN to
#              SRVMON_HTTP_BIND (default 127.0.0.1:8088).
# remote-deploy.sh turns SRVMON_PROXY into COMPOSE_PROFILES.
name: srvmon

services:
  caddy:
    image: caddy:2.11-alpine
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SRVMON_DOMAIN: ${SRVMON_DOMAIN:?set SRVMON_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

  server:
    image: ghcr.io/askidmobile/srvmon-server:${SRVMON_TAG:-latest}
    restart: unless-stopped
    environment:
      SRVMON_VM_URL: http://victoriametrics:8428
      SRVMON_PUBLIC_ORIGIN: https://${SRVMON_DOMAIN}
      SRVMON_TRUST_PROXY: "true"
      SRVMON_SECURE_COOKIE: "true"
      # Self-monitoring: register this host and hand its token to `agent`.
      SRVMON_SELF_TOKEN_FILE: /data/self-agent.token
      SRVMON_SELF_NAME: ${SRVMON_SELF_NAME:-monitor}
      # The add wizard installs this agent image on new servers. If the GHCR
      # package is private, give a read:packages token for the pull (it is
      # used once per install and logged out right after).
      SRVMON_AGENT_IMAGE: ghcr.io/askidmobile/srvmon-agent:${SRVMON_TAG:-latest}
      SRVMON_AGENT_REGISTRY_USER: ${SRVMON_AGENT_REGISTRY_USER:-}
      SRVMON_AGENT_REGISTRY_TOKEN: ${SRVMON_AGENT_REGISTRY_TOKEN:-}
      # AI agent: srvmon-ai answers on the compose network, and its tools
      # call back the tool API on :8081 (not published, not proxied).
      SRVMON_AI_URL: http://ai:8090
      SRVMON_AI_TOKEN: ${SRVMON_AI_TOKEN:-}
      SRVMON_AI_TOOLS_LISTEN: ":8081"
    volumes:
      - srvmon-data:/data
      # fail2ban on the host reads this file (jail srvmon-auth).
      - /var/log/srvmon:/var/log/srvmon
    expose:
      - "8080"
    ports:
      # Loopback only: for a reverse proxy already running on the host.
      - "${SRVMON_HTTP_BIND:-127.0.0.1:8088}:8080"
    depends_on:
      - victoriametrics

  # Agent for the monitoring host itself; the server registers it on start
  # and writes the token into its data volume.
  agent:
    image: ghcr.io/askidmobile/srvmon-agent:${SRVMON_TAG:-latest}
    restart: unless-stopped
    network_mode: host # real host interfaces in /proc/net/dev
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      # Published loopback port of srvmon-server (see SRVMON_HTTP_BIND).
      SRVMON_URL: http://${SRVMON_HTTP_BIND:-127.0.0.1:8088}
      SRVMON_TOKEN_FILE: /srvmon-data/self-agent.token
      SRVMON_INTERVAL: ${SRVMON_INTERVAL:-5s}
    volumes:
      - /proc:/host/proc:ro
      - /:/host:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - srvmon-data:/srvmon-data:ro
    depends_on:
      server:
        condition: service_healthy

  # AI agent (pi SDK). Only srvmon tools: no SSH keys, no shell of its own;
  # commands that change a server wait for the owner's confirmation in
  # srvmon-server. remote-deploy.sh generates SRVMON_AI_TOKEN; the provider
  # key comes from the GitHub secret AI_API_KEY.
  ai:
    image: ghcr.io/askidmobile/srvmon-ai:${SRVMON_TAG:-latest}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      SRVMON_AI_TOKEN: ${SRVMON_AI_TOKEN:-}
      SRVMON_TOOLS_URL: http://server:8081
      SRVMON_AI_PROVIDER: ${SRVMON_AI_PROVIDER:-deepseek}
      SRVMON_AI_MODEL: ${SRVMON_AI_MODEL:-deepseek-v4-pro}
      SRVMON_AI_API_KEY: ${SRVMON_AI_API_KEY:-}
      SRVMON_AI_THINKING: ${SRVMON_AI_THINKING:-low}
    volumes:
      - ai-data:/data
    expose:
      - "8090"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${SRVMON_RETENTION:-90d}
      - -httpListenAddr=:8428
    volumes:
      - vm-data:/storage
    expose:
      - "8428"

volumes:
  caddy-data:
  caddy-config:
  srvmon-data:
  vm-data:
  ai-data:
