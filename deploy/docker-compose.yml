# Central monitoring server. Deployed by .github/workflows/deploy.yml into
# DEPLOY_PATH (default /opt/srvmon) together with Caddyfile and .env.
#
# Two ways to expose the panel (SRVMON_PROXY in GitHub vars or .env):
#   caddy    - bundled Caddy takes 80/443 and gets the certificate (default);
#   external - the host already has a reverse proxy (nginx, Traefik, ...):
#              Caddy is not started, proxy https://SRVMON_DOMAIN to
#              SRVMON_HTTP_BIND (default 127.0.0.1:8088).
# remote-deploy.sh turns SRVMON_PROXY into COMPOSE_PROFILES.
name: srvmon

services:
  caddy:
    image: caddy:2.11-alpine
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SRVMON_DOMAIN: ${SRVMON_DOMAIN:?set SRVMON_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

  server:
    image: ghcr.io/askidmobile/srvmon-server:${SRVMON_TAG:-latest}
    restart: unless-stopped
    environment:
      SRVMON_VM_URL: http://victoriametrics:8428
      SRVMON_PUBLIC_ORIGIN: https://${SRVMON_DOMAIN}
      SRVMON_TRUST_PROXY: "true"
      SRVMON_SECURE_COOKIE: "true"
    volumes:
      - srvmon-data:/data
      # fail2ban on the host reads this file (jail srvmon-auth).
      - /var/log/srvmon:/var/log/srvmon
    expose:
      - "8080"
    ports:
      # Loopback only: for a reverse proxy already running on the host.
      - "${SRVMON_HTTP_BIND:-127.0.0.1:8088}:8080"
    depends_on:
      - victoriametrics

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${SRVMON_RETENTION:-90d}
      - -httpListenAddr=:8428
    volumes:
      - vm-data:/storage
    expose:
      - "8428"

volumes:
  caddy-data:
  caddy-config:
  srvmon-data:
  vm-data:
