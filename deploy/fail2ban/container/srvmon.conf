# Jails of the fail2ban container in the srvmon compose stack (service
# `fail2ban`, network host, NET_ADMIN). Bans land in the host firewall like a
# host-installed fail2ban; no apt on the host is needed.
#
# remote-deploy.sh writes zz-srvmon.local next to this file: the ban chain of
# srvmon-auth for the proxy mode and the sshd jail when the host has
# /var/log/auth.log.
#
# Every jail bans as usual and also reports the ban to srvmon-server through
# srvmon-notify, which turns it into an alert.

[srvmon-auth]
enabled  = true
filter   = srvmon-auth
logpath  = /var/log/srvmon/auth.log
backend  = polling
maxretry = 5
findtime = 10m
bantime  = 1h
# Published docker ports bypass INPUT, so with bundled Caddy the ban goes to
# DOCKER-USER; with a host reverse proxy (SRVMON_PROXY=external) to INPUT.
chain    = DOCKER-USER
port     = http,https
action   = %(action_)s
           srvmon-notify[name=%(__name__)s]

# Repeat offenders (banned 3 times in a day) get 24h on every port.
# F2B_LOG_TARGET in docker-compose.yml points fail2ban's own log here.
[recidive]
enabled  = true
logpath  = /data/fail2ban.log
backend  = polling
bantime  = 24h
findtime = 1d
maxretry = 3
action   = %(action_)s
           srvmon-notify[name=%(__name__)s]

# Host sshd, read from the host's /var/log mounted at /var/log/host.
# Enabled by zz-srvmon.local only when that log exists. Bans every port: the
# host may run sshd on more than one.
[sshd]
enabled  = false
logpath  = /var/log/host/auth.log
backend  = polling
port     = 0:65535
maxretry = 5
findtime = 10m
bantime  = 1h
action   = %(action_)s
           srvmon-notify[name=%(__name__)s]
