# Appends every ban to a file that srvmon-server follows (alert rule
# "fail2ban"); the panel then sends it to Telegram. Line format:
# 2026-10-31T09:00:00Z ban jail=sshd ip=203.0.113.7 failures=5
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = printf '%%s ban jail=<name> ip=<ip> failures=<failures>\n' "$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" >> <logpath>
actionunban =

[Init]
name = default
logpath = /var/log/srvmon/fail2ban-events.log
