# Install: copy filter.d/srvmon-auth.conf and this file into /etc/fail2ban/,
# then `systemctl reload fail2ban`. deploy/install-host.sh does it for you.

[srvmon-auth]
enabled  = true
filter   = srvmon-auth
logpath  = /var/log/srvmon/auth.log
backend  = auto
maxretry = 5
findtime = 10m
bantime  = 1h
# Published docker ports bypass INPUT; ban in DOCKER-USER so Caddy is covered.
# install-host.sh switches it to INPUT for SRVMON_PROXY=external (srvmon.local).
chain    = DOCKER-USER
port     = http,https

# Repeat offenders (banned 3 times in a day) get 24h on every port.
[recidive]
enabled  = true
logpath  = /var/log/fail2ban.log
bantime  = 24h
findtime = 1d
maxretry = 3

[sshd]
enabled  = true
maxretry = 5
findtime = 10m
bantime  = 1h
