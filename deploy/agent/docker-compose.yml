# srvmon-agent for a monitored server.
#   SRVMON_URL=https://mon.example.com SRVMON_TOKEN=a_xxx docker compose up -d
# The agent only pushes metrics; it opens no ports and runs no commands.
name: srvmon-agent

services:
  # The only container with the docker socket: serves the agent a filtered
  # read-only Docker API (GET containers/version/_ping, no Env in inspect).
  dockerproxy:
    image: ghcr.io/askidmobile/srvmon-agent:${SRVMON_TAG:-latest}
    entrypoint: ["/srvmon-agent", "dockerproxy"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockerproxy:/run/srvmon

  agent:
    image: ghcr.io/askidmobile/srvmon-agent:${SRVMON_TAG:-latest}
    restart: unless-stopped
    network_mode: host # real host interfaces in /proc/net/dev
    pid: host          # host processes (server screen, stage 2)
    read_only: true
    security_opt:
      - no-new-privileges=true
    environment:
      SRVMON_URL: ${SRVMON_URL:?set SRVMON_URL}
      SRVMON_TOKEN: ${SRVMON_TOKEN:?set SRVMON_TOKEN}
      SRVMON_INTERVAL: ${SRVMON_INTERVAL:-5s}
      DOCKER_SOCK: /run/srvmon/docker.sock
    volumes:
      - /proc:/host/proc:ro
      - /:/host:ro,rslave
      # Docker API through the dockerproxy service below, read-only calls only.
      - dockerproxy:/run/srvmon:ro
    tmpfs:
      # Hides the host's /run (docker and containerd sockets) from /host.
      - /host/run:ro,size=64k
    depends_on:
      - dockerproxy

volumes:
  dockerproxy:
